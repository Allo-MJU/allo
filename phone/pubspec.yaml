name: allo_phone
description: 알로 — 뒷자리 아이용 수집 게임 (폰 앱)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  allo_core:
    path: packages/allo_core
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.3
  mobile_scanner: ^6.0.2
  shared_preferences: ^2.3.2
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/species/
    - assets/poses/road_sprout/run-sheet.png
    - assets/poses/puddle_pip/run-sheet.png
    - assets/poses/lamp_moth/run-sheet.png
    - assets/poses/storm_lantern/run-sheet.png
    - assets/poses/highway_comet/run-sheet.png
    - assets/poses/sea_mist/run-sheet.png
    - assets/egg/
    - assets/ui/
    - assets/data/characters.json
    - assets/data/species.json
    - assets/data/travel_places.json
    - assets/data/companion_learning.json
    - assets/data/cabin_dialogue.json
    - assets/data/window_stories_ko.json
